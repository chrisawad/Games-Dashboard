<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18141f">
  <meta name="description" content="Browse and play five puzzle, word, and strategy games by Chris Awad.">
  <meta name="apple-mobile-web-app-title" content="Games Dashboard">
  <title>Ultimate Games</title>
  <link rel="canonical" href="https://chrisawad.github.io/Games-Dashboard/">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/ultimate-games-192.png">
  <link rel="apple-touch-icon" href="./icons/ultimate-games-180.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#library">Skip to games</a>
  <header class="topbar">
    <div class="frame">
      <div class="topbar-row">
        <p class="topbar-title">Dashboard</p>
        <div class="topbar-actions">
          <button class="bar-button" id="install" type="button" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/>
            </svg>
            Install app
          </button>
          <button class="bar-button share-button" id="share" type="button" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="m18 5-12 7 12 7" fill="none" stroke="currentColor" stroke-width="2.25"/>
              <circle cx="18" cy="5" r="3.5"/>
              <circle cx="6" cy="12" r="3.5"/>
              <circle cx="18" cy="19" r="3.5"/>
            </svg>
            Share
          </button>
        </div>
      </div>
      <p class="bar-status" id="install-status" role="status"></p>
      <p class="bar-status" id="share-status" role="status"></p>
      <input id="share-link" type="url" aria-label="Dashboard link to copy" readonly hidden>
    </div>
  </header>
  <main class="page frame">
    <header class="hero">
      <div class="skyline" aria-hidden="true"></div>
      <div class="hero-copy">
        <h1>Ultimate <span>Games</span></h1>
        <p>Pick a puzzle, find a word, or challenge a friend.</p>
      </div>
    </header>
    <section id="library" tabindex="-1" aria-labelledby="library-heading">
      <div class="toolbar">
        <div class="section-title">
          <span class="shelf-symbol" aria-hidden="true"></span>
          <h2 id="library-heading">Game library</h2>
          <span class="count" id="count" hidden></span>
        </div>
        <label class="filter" hidden>
          <span class="visually-hidden">Filter games by play mode</span>
          <select id="mode"><option value="">All play modes</option></select>
        </label>
      </div>
      <p id="catalog-status" class="visually-hidden" role="status">Loading games…</p>
      <noscript><p>Enable JavaScript to browse the library, or use the <a href="https://github.com/chrisawad/Games-Dashboard#ultimate-games">game links in the README</a>.</p></noscript>
      <div class="games" id="games"></div>
    </section>
    <footer>
      <div class="update-tools" id="update-tools" hidden>
        <button class="bar-button" id="check-update" type="button">Check for updates</button>
        <span id="update-status" role="status"></span>
      </div>
      <span>Games by <a href="https://github.com/chrisawad">Chris Awad</a></span>
      <span>Opening a game for the first time may require a connection.</span>
    </footer>
  </main>
  <dialog id="update-dialog" aria-labelledby="update-title" aria-describedby="update-detail">
    <h2 id="update-title">A new version is ready</h2>
    <p id="update-detail">Reload to use the latest Games Dashboard.</p>
    <form method="dialog" class="update-actions">
      <button class="bar-button share-button" id="apply-update" type="button" autofocus>Update now</button>
      <button class="bar-button" type="submit">Later</button>
    </form>
  </dialog>
  <template id="game-template">
    <article class="card">
      <div class="cover"><img class="game-icon" width="100" height="100" alt=""></div>
      <div class="card-body">
        <h3></h3>
        <p class="description"></p>
        <ul class="modes" aria-label="Play modes"></ul>
        <details hidden>
          <summary>Online play options</summary>
          <ul class="join-options"></ul>
        </details>
        <div class="actions">
          <a class="play" target="_top"><span class="play-symbol" aria-hidden="true"></span>Play</a>
          <a class="source">Source</a>
        </div>
      </div>
    </article>
  </template>
</body>
</html>
